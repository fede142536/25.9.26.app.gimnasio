<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gimnasio</title>
<meta name="description" content="Registrá tus rutinas, tus series y tu progreso. Sin backend: se instala y funciona sin conexión.">

<!-- PWA: se instala como app (ícono propio, pantalla completa) y funciona sin conexión -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B4790A">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gimnasio">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>Gimnasio</h1>
    <div class="header-actions">
      <span class="date" id="todayLabel"></span>
      <button class="icon-btn-round" id="settingsBtn" title="Configuración y respaldo">⚙️</button>
    </div>
  </header>
  <button id="installBtn" class="install-banner" hidden>⬇️ Instalar la app en este dispositivo</button>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-view="hoy" class="active">Hoy</button>
    <button data-view="rutinas">Rutinas</button>
    <button data-view="entrenador">Entrenador</button>
    <button data-view="progreso">Progreso</button>
  </nav>
</div>
<div id="modalHost"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
