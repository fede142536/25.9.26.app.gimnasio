<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Musculación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font-display: 'Oswald', 'Arial Narrow', sans-serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

    --bg: #EEF0F2;
    --surface: #FFFFFF;
    --surface-2: #E3E7EC;
    --border: #D2D8DE;
    --text: #14161A;
    --text-muted: #5B616B;
    --accent: #B4790A;
    --accent-ink: #FFFFFF;
    --success: #2F7A4E;
    --danger: #B23A2E;
    --radius: 14px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15171B;
      --surface: #1D2026;
      --surface-2: #262A32;
      --border: #343A44;
      --text: #EDEFF2;
      --text-muted: #939AA6;
      --accent: #E8B23D;
      --accent-ink: #17181C;
      --success: #5FA777;
      --danger: #E0685C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15171B;
    --surface: #1D2026;
    --surface-2: #262A32;
    --border: #343A44;
    --text: #EDEFF2;
    --text-muted: #939AA6;
    --accent: #E8B23D;
    --accent-ink: #17181C;
    --success: #5FA777;
    --danger: #E0685C;
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  #app { display: flex; flex-direction: column; height: 100%; max-width: 520px; margin: 0 auto; }

  header.topbar {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 14px 18px 10px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
  }
  header.topbar h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.3px;
    margin: 0;
  }
  header.topbar .date { color: var(--text-muted); font-size: 13px; }

  main { flex: 1; overflow-y: auto; padding: 4px 14px 96px; }

  select.day-select {
    width: 100%;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 15px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    margin: 6px 0 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px 16px;
    margin-bottom: 12px;
  }
  .card.done { opacity: 0.55; }

  .ex-name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 0.2px;
    margin: 0 0 2px;
  }
  .ex-meta { font-size: 12.5px; color: var(--text-muted); margin-bottom: 12px; }
  .ex-meta b { color: var(--text); font-weight: 600; }

  .weight-row {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    margin-bottom: 10px;
  }
  .stepper-btn {
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 20px; font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  .weight-value {
    font-family: var(--font-display);
    font-size: 40px; font-weight: 700;
    min-width: 118px; text-align: center;
    border: none; background: transparent; color: var(--text);
  }
  .weight-unit { font-size: 13px; color: var(--text-muted); text-align: center; margin-top: -6px; margin-bottom: 10px; }

  .reps-row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 12px; }
  .reps-row input {
    width: 52px; text-align: center; font-family: var(--font-body); font-weight: 600;
    font-size: 15px; padding: 6px 4px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text);
  }
  .reps-row span { font-size: 13px; color: var(--text-muted); }

  .set-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); }
  .dot.filled { background: var(--success); }

  .log-btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: var(--accent); color: var(--accent-ink);
    font-family: var(--font-body); font-weight: 700; font-size: 15px;
  }
  .log-btn:active { opacity: 0.85; }
  .log-btn[disabled] { background: var(--surface-2); color: var(--text-muted); }

  .pr-badge {
    display: inline-block; font-size: 11.5px; font-weight: 700; color: var(--accent);
    margin-top: 8px; text-align: center; width: 100%;
  }

  nav.tabbar {
    display: flex; border-top: 1px solid var(--border);
    background: var(--surface);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  nav.tabbar button {
    flex: 1; padding: 12px 0 10px; border: none; background: transparent;
    color: var(--text-muted); font-family: var(--font-body); font-weight: 600; font-size: 12.5px;
  }
  nav.tabbar button.active { color: var(--accent); }

  .rest-bar {
    position: sticky; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    background: var(--accent); color: var(--accent-ink);
    padding: 10px 16px; margin: 0 -14px 8px;
    font-family: var(--font-display); font-weight: 600; font-size: 16px;
  }
  .rest-bar button {
    border: none; background: rgba(255,255,255,0.25); color: inherit;
    border-radius: 8px; padding: 6px 12px; font-family: var(--font-body); font-weight: 600; font-size: 13px;
  }

  h2.section-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; margin: 18px 0 8px; }
  .day-block { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
  .day-block-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .day-block-head input { font-family: var(--font-display); font-weight: 600; font-size: 16px; background: transparent; border: none; color: var(--text); width: 65%; }
  .icon-btn { border: none; background: transparent; color: var(--text-muted); font-size: 16px; padding: 4px 6px; }

  .ex-row { display: grid; grid-template-columns: 1fr 44px 44px 56px 28px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .ex-row input {
    font-family: var(--font-body); font-size: 13px; padding: 7px 6px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text); width: 100%; min-width: 0;
  }
  .add-ex-btn, .add-day-btn {
    width: 100%; padding: 10px; border: 1px dashed var(--border); border-radius: 10px;
    background: transparent; color: var(--text-muted); font-weight: 600; font-size: 13.5px; margin-top: 4px;
  }

  .hist-item { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .hist-item:last-child { border-bottom: none; }
  .hist-item .d { color: var(--text-muted); font-size: 12.5px; }
  .hist-w { font-family: var(--font-display); font-weight: 600; }
  select.ex-picker {
    width: 100%; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-weight: 600; margin-bottom: 12px;
  }
  .empty { color: var(--text-muted); font-size: 13.5px; text-align: center; padding: 40px 20px; line-height: 1.5; }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>Musculación</h1>
    <span class="date" id="todayLabel"></span>
  </header>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-view="hoy" class="active">Hoy</button>
    <button data-view="rutina">Rutina</button>
    <button data-view="progreso">Progreso</button>
  </nav>
</div>

<script>
/**
 * ---- Persistencia ----
 * Todo el estado vive en localStorage bajo una sola clave.
 * days: rutinas del entrenador, agrupadas por día (Día A, Día B, ...)
 * logs: cada serie registrada, con fecha, ejercicio, peso y repeticiones
 */
const STORAGE_KEY = 'musculacion_v1';

/** Carga el estado desde localStorage o devuelve un estado inicial vacío. */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) { /* localStorage no disponible o corrupto: seguimos con estado vacío */ }
  return { days: [], logs: [], selectedDayId: null };
}

/** Guarda el estado completo en localStorage. */
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { /* almacenamiento lleno o bloqueado */ }
}

let state = loadState();
let currentView = 'hoy';
let restTimer = { active: false, secondsLeft: 0, total: 0, intervalId: null, exerciseName: '' };
/** progreso de series de hoy por ejercicio: { [exerciseId]: { setsLogged: n, weight, reps } } */
let todaySets = {};

/** Genera un id corto y suficientemente único para el uso local de esta app. */
function uid() { return Math.random().toString(36).slice(2, 9); }

function todayISO() { return new Date().toISOString().slice(0, 10); }

const WEEKDAY_LABELS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function formatToday() {
  const d = new Date();
  return `${WEEKDAY_LABELS[d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}

/* ---------------- Sonido y vibración del timer de descanso ---------------- */

/** Reproduce un beep corto con la Web Audio API (sin archivos externos). */
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.55);
  } catch (e) { /* audio bloqueado por el navegador hasta una interacción; no es crítico */ }
}

function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* no soportado */ }
}

/** Arranca (o reinicia) el timer de descanso para un ejercicio, en segundos. */
function startRest(seconds, exerciseName) {
  clearInterval(restTimer.intervalId);
  restTimer = { active: true, secondsLeft: seconds, total: seconds, exerciseName, intervalId: null };
  restTimer.intervalId = setInterval(() => {
    restTimer.secondsLeft--;
    if (restTimer.secondsLeft <= 0) {
      clearInterval(restTimer.intervalId);
      restTimer.active = false;
      vibrate([200, 100, 200]);
      playBeep();
    }
    render();
  }, 1000);
  render();
}

function skipRest() {
  clearInterval(restTimer.intervalId);
  restTimer.active = false;
  render();
}

/* ---------------- Datos derivados ---------------- */

/** Devuelve el último peso registrado para un ejercicio (para no tener que recordarlo). */
function lastWeightFor(exerciseId) {
  const entries = state.logs.filter(l => l.exerciseId === exerciseId).sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts);
  return entries.length ? entries[0].weight : null;
}

/** Máximo peso histórico registrado para un ejercicio (para detectar PRs). */
function maxWeightFor(exerciseId) {
  const entries = state.logs.filter(l => l.exerciseId === exerciseId);
  return entries.length ? Math.max(...entries.map(l => l.weight)) : 0;
}

function getSelectedDay() {
  return state.days.find(d => d.id === state.selectedDayId) || state.days[0] || null;
}

/* ---------------- Vista: Hoy ---------------- */

function renderHoy() {
  const day = getSelectedDay();
  const main = document.getElementById('main');

  if (!state.days.length) {
    main.innerHTML = `<div class="empty">Todavía no cargaste ninguna rutina.<br>Andá a la pestaña <b>Rutina</b> y cargá los días y ejercicios que te armó tu entrenador.</div>`;
    return;
  }

  let html = '';
  if (restTimer.active || restTimer.secondsLeft === 0 && restTimer.total > 0 && restTimer.exerciseName) {
    // banda de descanso visible mientras corre
  }
  if (restTimer.active) {
    const m = String(Math.floor(restTimer.secondsLeft / 60)).padStart(2, '0');
    const s = String(restTimer.secondsLeft % 60).padStart(2, '0');
    html += `<div class="rest-bar">
      <span>Descanso · ${restTimer.exerciseName} · ${m}:${s}</span>
      <button onclick="skipRest()">Saltar</button>
    </div>`;
  }

  html += `<select class="day-select" onchange="selectDay(this.value)">
    ${state.days.map(d => `<option value="${d.id}" ${d.id === day.id ? 'selected' : ''}>${escapeHtml(d.name)}</option>`).join('')}
  </select>`;

  if (!day.exercises.length) {
    html += `<div class="empty">Este día todavía no tiene ejercicios cargados.</div>`;
  }

  for (const ex of day.exercises) {
    const prog = todaySets[ex.id] || { setsLogged: 0, weight: null, reps: ex.reps };
    if (prog.weight == null) prog.weight = lastWeightFor(ex.id) ?? 0;
    todaySets[ex.id] = prog;

    const done = prog.setsLogged >= ex.sets;
    const last = lastWeightFor(ex.id);
    const dots = Array.from({ length: ex.sets }, (_, i) =>
      `<span class="dot ${i < prog.setsLogged ? 'filled' : ''}"></span>`).join('');

    html += `<div class="card ${done ? 'done' : ''}">
      <p class="ex-name">${escapeHtml(ex.name)}</p>
      <p class="ex-meta">${ex.sets} series × ${ex.reps} reps · descanso ${ex.rest}s
        ${last != null ? ` · última vez: <b>${last} kg</b>` : ''}</p>
      <div class="weight-row">
        <button class="stepper-btn" onclick="adjustWeight('${ex.id}', -2.5)">−</button>
        <input class="weight-value" type="number" step="0.5" value="${prog.weight}"
          oninput="setWeight('${ex.id}', this.value)">
        <button class="stepper-btn" onclick="adjustWeight('${ex.id}', 2.5)">+</button>
      </div>
      <p class="weight-unit">kg</p>
      <div class="reps-row">
        <span>Reps:</span>
        <input type="number" value="${prog.reps}" oninput="setReps('${ex.id}', this.value)">
      </div>
      <div class="set-dots">${dots}</div>
      <button class="log-btn" ${done ? 'disabled' : ''} onclick="logSet('${ex.id}', '${day.id}')">
        ${done ? 'Ejercicio completo' : `Registrar serie ${prog.setsLogged + 1} / ${ex.sets}`}
      </button>
      <div id="pr-${ex.id}"></div>
    </div>`;
  }

  main.innerHTML = html;
}

function selectDay(id) { state.selectedDayId = id; todaySets = {}; saveState(); render(); }

function adjustWeight(exId, delta) {
  const prog = todaySets[exId];
  prog.weight = Math.max(0, Math.round((prog.weight + delta) * 2) / 2);
  render();
}
function setWeight(exId, value) { todaySets[exId].weight = parseFloat(value) || 0; }
function setReps(exId, value) { todaySets[exId].reps = parseInt(value) || 0; }

/** Registra una serie completada: guarda el log y arranca el descanso del ejercicio. */
function logSet(exId, dayId) {
  const day = state.days.find(d => d.id === dayId);
  const ex = day.exercises.find(e => e.id === exId);
  const prog = todaySets[exId];
  const wasMax = maxWeightFor(exId);

  state.logs.push({ id: uid(), ts: Date.now(), date: todayISO(), dayId, exerciseId: exId, weight: prog.weight, reps: prog.reps });
  prog.setsLogged++;
  saveState();

  if (prog.weight > wasMax) {
    const el = document.getElementById(`pr-${exId}`);
    if (el) el.innerHTML = `<p class="pr-badge">Nuevo PR: ${prog.weight} kg</p>`;
  }

  if (prog.setsLogged < ex.sets) startRest(ex.rest, ex.name);
  render();
}

/* ---------------- Vista: Rutina ---------------- */

function renderRutina() {
  const main = document.getElementById('main');
  let html = `<h2 class="section-title">Tus días de entrenamiento</h2>`;

  for (const day of state.days) {
    html += `<div class="day-block">
      <div class="day-block-head">
        <input value="${escapeHtml(day.name)}" onchange="renameDay('${day.id}', this.value)">
        <button class="icon-btn" onclick="removeDay('${day.id}')">Borrar día</button>
      </div>`;
    for (const ex of day.exercises) {
      html += `<div class="ex-row">
        <input placeholder="Ejercicio" value="${escapeHtml(ex.name)}" onchange="updateEx('${day.id}','${ex.id}','name',this.value)">
        <input type="number" title="series" value="${ex.sets}" onchange="updateEx('${day.id}','${ex.id}','sets',this.value)">
        <input type="number" title="reps" value="${ex.reps}" onchange="updateEx('${day.id}','${ex.id}','reps',this.value)">
        <input type="number" title="descanso (s)" value="${ex.rest}" onchange="updateEx('${day.id}','${ex.id}','rest',this.value)">
        <button class="icon-btn" onclick="removeEx('${day.id}','${ex.id}')">✕</button>
      </div>`;
    }
    html += `<button class="add-ex-btn" onclick="addExercise('${day.id}')">+ Agregar ejercicio</button></div>`;
  }

  html += `<button class="add-day-btn" onclick="addDay()">+ Agregar día</button>`;
  main.innerHTML = html;
}

function addDay() {
  state.days.push({ id: uid(), name: `Día ${String.fromCharCode(65 + state.days.length)}`, exercises: [] });
  if (!state.selectedDayId) state.selectedDayId = state.days[0].id;
  saveState(); render();
}
function removeDay(id) {
  state.days = state.days.filter(d => d.id !== id);
  if (state.selectedDayId === id) state.selectedDayId = state.days[0]?.id || null;
  saveState(); render();
}
function renameDay(id, name) { state.days.find(d => d.id === id).name = name; saveState(); }
function addExercise(dayId) {
  state.days.find(d => d.id === dayId).exercises.push({ id: uid(), name: '', sets: 4, reps: 10, rest: 90 });
  saveState(); render();
}
function removeEx(dayId, exId) {
  const day = state.days.find(d => d.id === dayId);
  day.exercises = day.exercises.filter(e => e.id !== exId);
  saveState(); render();
}
function updateEx(dayId, exId, field, value) {
  const ex = state.days.find(d => d.id === dayId).exercises.find(e => e.id === exId);
  ex[field] = (field === 'name') ? value : (parseFloat(value) || 0);
  saveState();
}

/* ---------------- Vista: Progreso ---------------- */

function allExercises() {
  const map = new Map();
  for (const day of state.days) for (const ex of day.exercises) if (ex.name) map.set(ex.id, ex.name);
  return Array.from(map.entries());
}

let progressExId = null;

function renderProgreso() {
  const main = document.getElementById('main');
  const exList = allExercises();

  if (!exList.length) {
    main.innerHTML = `<div class="empty">Cuando registres series vas a poder ver acá la evolución del peso de cada ejercicio.</div>`;
    return;
  }
  if (!progressExId) progressExId = exList[0][0];

  let html = `<select class="ex-picker" onchange="selectProgressEx(this.value)">
    ${exList.map(([id, name]) => `<option value="${id}" ${id === progressExId ? 'selected' : ''}>${escapeHtml(name)}</option>`).join('')}
  </select>`;

  const entries = state.logs.filter(l => l.exerciseId === progressExId).sort((a, b) => b.date.localeCompare(a.date) || b.ts - a.ts);
  if (!entries.length) {
    html += `<div class="empty">Todavía no registraste series de este ejercicio.</div>`;
  } else {
    const max = maxWeightFor(progressExId);
    html += `<div class="card"><p class="ex-meta">Récord actual: <b>${max} kg</b></p></div>`;
    html += `<div class="card">` + entries.map(e =>
      `<div class="hist-item"><span class="d">${e.date}</span><span class="hist-w">${e.weight} kg × ${e.reps}${e.weight === max ? ' 🏆' : ''}</span></div>`
    ).join('') + `</div>`;
  }
  main.innerHTML = html;
}
function selectProgressEx(id) { progressExId = id; render(); }

/* ---------------- Router simple ---------------- */

function render() {
  document.getElementById('todayLabel').textContent = formatToday();
  document.querySelectorAll('nav.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
  if (currentView === 'hoy') renderHoy();
  else if (currentView === 'rutina') renderRutina();
  else renderProgreso();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

document.querySelectorAll('nav.tabbar button').forEach(btn => {
  btn.addEventListener('click', () => { currentView = btn.dataset.view; render(); });
});

if (!state.selectedDayId && state.days.length) state.selectedDayId = state.days[0].id;
render();
</script>
</body>
</html>
