<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gimnasio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>Gimnasio</h1>
    <div class="header-actions">
      <span class="date" id="todayLabel"></span>
      <button class="icon-btn-round" id="settingsBtn" title="Configuración y respaldo">⚙️</button>
    </div>
  </header>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-view="hoy" class="active">Hoy</button>
    <button data-view="rutinas">Rutinas</button>
    <button data-view="entrenador">Entrenador</button>
    <button data-view="progreso">Progreso</button>
  </nav>
</div>
<div id="modalHost"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
